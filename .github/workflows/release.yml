name: Desktop Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-release-tag.mjs "${{ github.ref_name }}"

  vscode:
    needs: validate-tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir extensions/vscode check
      - run: pnpm package:vscode
      - run: pnpm --dir packages/cli check
      - run: pnpm --dir packages/cli pack:check
      - uses: actions/upload-artifact@v4
        with:
          name: evir-vscode-${{ github.ref_name }}
          path: extensions/vscode/artifacts/evir.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: evir-cli-${{ github.ref_name }}
          path: packages/cli/artifacts/evir-cli-*.tgz

  build:
    needs: validate-tag
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
      WINDOWS_CERTIFICATE_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-latest
            os: macos
            arch: x64
            target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin
            artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            os: windows
            arch: x64
            target: ""
            build_args: ""
            artifact_path: src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --no-frozen-lockfile

      - name: Install explicit macOS Rust target
        if: matrix.os == 'macos'
        run: rustup target add ${{ matrix.target }}

      - name: Sync app version from package.json
        run: |
          node -e "
          const fs = require('fs');
          const pkg = require('./package.json');
          const conf = require('./src-tauri/tauri.conf.json');
          conf.version = pkg.version;
          fs.writeFileSync('./src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      # Signing is optional: when the certificate secrets are unset, the steps below
      # are skipped and tauri-action produces unsigned artifacts. Unsigned builds are
      # for development/testing only — do not distribute them as release binaries.
      - name: Import Apple Developer Certificate
        if: matrix.os == 'macos' && env.APPLE_CERTIFICATE_CONFIGURED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -o '"[^"]*"' | head -n1 | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Import Windows Certificate
        if: matrix.os == 'windows' && env.WINDOWS_CERTIFICATE_CONFIGURED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path certificate
          Set-Content -Path certificate\certificate.b64 -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate\certificate.b64 certificate\certificate.pfx
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath certificate\certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item -Recurse -Force certificate
          echo "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Evir ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.os == 'windows' && env.WINDOWS_CERTIFICATE_CONFIGURED == 'true' && format('--config {"bundle":{"windows":{"certificateThumbprint":"{0}"}}}', env.WINDOWS_CERTIFICATE_THUMBPRINT) || matrix.build_args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evir-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
