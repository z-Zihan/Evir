name: Benchmark

on:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Snapshot the committed baseline before scripts/benchmark.mjs overwrites
      # docs/benchmarks/latest.json. The baseline is versioned with the repo:
      # intentional performance changes must update it in the same PR.
      - name: Snapshot committed benchmark baseline
        run: cp docs/benchmarks/latest.json baseline.json 2>/dev/null || echo "no committed baseline"
      - run: pnpm build:web
      - run: pnpm build:desktop:frontend
      - run: node scripts/benchmark.mjs
      - name: Check platform budgets
        run: |
          node -e "
          const report = require('./docs/benchmarks/latest.json');
          const checks = [
            ['Web initial JS gzip', report.web.budgetStatus],
            ['Web Skill chunks', report.web.skillChunkStatus],
            ['Desktop frontend resources', report.desktop.frontend.budgetStatus],
            ['Desktop Skill chunks', report.desktop.frontend.skillChunkStatus],
          ];
          let failed = false;
          for (const [name, status] of checks) {
            console.log(name + ': ' + status);
            if (status !== 'pass') failed = true;
          }
          if (failed) process.exit(1);
          "
      - name: Check for regressions against committed baseline
        run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('baseline.json')) {
            console.log('No committed baseline found, skipping regression check.');
            process.exit(0);
          }
          const prev = JSON.parse(fs.readFileSync('baseline.json', 'utf8'));
          const curr = JSON.parse(fs.readFileSync('docs/benchmarks/latest.json', 'utf8'));

          const metrics = [
            ['web.initialJsGzipSizeBytes', prev.web?.initialJsGzipSizeBytes ?? prev.web?.jsGzipSizeBytes, curr.web?.initialJsGzipSizeBytes],
            ['web.cssGzipSizeBytes', prev.web?.cssGzipSizeBytes, curr.web?.cssGzipSizeBytes],
            ['web.totalSizeBytes', prev.web?.totalSizeBytes ?? prev.dist?.totalSizeBytes, curr.web?.totalSizeBytes],
            ['desktop.frontend.totalSizeBytes', prev.desktop?.frontend?.totalSizeBytes, curr.desktop?.frontend?.totalSizeBytes],
          ];

          const THRESHOLD = 0.05;
          let failed = false;
          for (const [name, prevValue, currValue] of metrics) {
            if (typeof prevValue !== 'number' || typeof currValue !== 'number' || prevValue <= 0) {
              console.log(\`\${name}: skipped (missing baseline)\`);
              continue;
            }
            const delta = (currValue - prevValue) / prevValue;
            const pct = (delta * 100).toFixed(2);
            console.log(\`\${name}: \${prevValue} -> \${currValue} (\${pct}%)\`);
            if (delta > THRESHOLD) {
              console.log(\`::error::\${name} regressed by \${pct}% (baseline: \${prevValue}, current: \${currValue}), exceeds 5% threshold; update docs/benchmarks/latest.json in this PR if the change is intentional\`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          "
      - name: Stamp benchmark with commit SHA
        run: cp docs/benchmarks/latest.json "docs/benchmarks/${GITHUB_SHA}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            docs/benchmarks/latest.json
            docs/benchmarks/${{ github.sha }}.json
