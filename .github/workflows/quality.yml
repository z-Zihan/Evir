name: Quality

# Daily quality gate for every PR targeting main and every push to main.
# Packaging/signing/artifacts run only on release tags (release.yml); size
# budgets run separately on main pushes (benchmark.yml). Commands reuse the
# package scripts so local and CI run the identical gate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --no-frozen-lockfile
      - name: Quality gate (format/lint/typecheck/unit+integration/Rust/VS Code/CLI/workflow validation)
        run: pnpm check
      - name: Web build sanity
        run: pnpm build:web
