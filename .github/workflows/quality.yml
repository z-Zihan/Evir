name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build:web
      - run: pnpm build:vscode
      - run: pnpm build:cli
      - run: pnpm --dir packages/cli test:smoke

  vscode-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:vscode
      - run: xvfb-run -a pnpm --dir extensions/vscode test:host
      - uses: actions/upload-artifact@v4
        with:
          name: evir-vscode-vsix
          path: extensions/vscode/artifacts/evir.vsix
